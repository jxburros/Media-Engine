name: Release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, preview]
        default: stable
      dry_run:
        description: Build and verify every asset without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  plan:
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/plan.yml@d7f42f9910c075ef34915fa2b95cf28dd2be534a
    with:
      toolkit-ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
      channel: ${{ inputs.channel }}
  build-cpu-python:
    needs: plan
    if: needs.plan.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - run: cargo build --release --locked --manifest-path native/Cargo.toml
      - run: python packaging/check-linked-libraries.py native/target/release/media-engine-native
      - run: native/target/release/media-engine-native --probe
      - run: bash packaging/package-native.sh native/target/release/media-engine-native cpu dist
      - run: python -m pip install build==1.2.2.post1
      - run: bash packaging/package-python.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payload-cpu-python
          path: dist/*
          if-no-files-found: error
  build-cuda:
    needs: plan
    if: needs.plan.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Compile RTX 4090 native binary without a GPU
        run: docker buildx build --file packaging/Dockerfile.native --target native-artifact --output type=local,dest=cuda-output .
      - run: bash packaging/package-native.sh cuda-output/media-engine-native cuda dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payload-cuda
          path: dist/*
          if-no-files-found: error
  build-container:
    needs: plan
    if: needs.plan.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Build non-root offline-inference image
        env:
          RELEASE_VERSION: ${{ fromJSON(needs.plan.outputs.apps)['media-engine'].version }}
        run: |
          docker buildx build --load --tag "media-engine:$RELEASE_VERSION-cuda" .
          test "$(docker image inspect --format '{{.Config.User}}' "media-engine:$RELEASE_VERSION-cuda")" = '10001:10001'
          docker run --rm "media-engine:$RELEASE_VERSION-cuda" --probe
          mkdir -p dist
          docker save "media-engine:$RELEASE_VERSION-cuda" | gzip -1 > "dist/media-engine-python-v$RELEASE_VERSION-linux-x64-cuda-image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payload-container
          path: dist/*
          if-no-files-found: error
  stage:
    needs: [plan, build-cpu-python, build-cuda, build-container]
    if: needs.plan.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: JX-Holdings-LLC/release-infrastructure
          ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
          path: .toolkit
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: payload-*
          path: payloads
          merge-multiple: true
      - name: Stage complete source-bound inventory and checksums
        env:
          RELEASE_SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: node .toolkit/src/release.mjs stage --app media-engine --from payloads --bundle release-bundle --sha "$RELEASE_SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundle
          path: release-bundle
          if-no-files-found: error
  finish:
    needs: [plan, stage]
    if: needs.plan.outputs.selected == 'true'
    permissions:
      contents: write
    uses: JX-Holdings-LLC/release-infrastructure/.github/workflows/finish.yml@d7f42f9910c075ef34915fa2b95cf28dd2be534a
    with:
      toolkit-ref: d7f42f9910c075ef34915fa2b95cf28dd2be534a
      source-sha: ${{ needs.plan.outputs.sha }}
      app: media-engine
      security: standard
      artifact: release-bundle
      dry-run: ${{ inputs.dry_run }}
