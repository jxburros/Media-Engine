[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"
[project]
name = "media-engine"
version = "0.1.0"
description = "Local, single-flight SDXL inference worker for Media Runtime"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []
[project.optional-dependencies]
inference = ["torch==2.6.0", "diffusers==0.32.2", "transformers==4.49.0", "accelerate==1.4.0", "safetensors==0.5.3", "Pillow==11.1.0", "numpy==2.2.3"]
[project.scripts]
media-engine = "media_engine.server:main"
[tool.setuptools.packages.find]
where = ["src"]
